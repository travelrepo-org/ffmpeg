name: Jourfin ffmpeg release
# Builds the ffmpeg that Jourfin bundles (https://github.com/travelrepo-org/jourfin, docs/OUTPUTS.md §4) and publishes
# it as a release of this repository with its source, licences and checksums. Started by hand only.
#
# Linux and Windows (x64, ARM64): static GPL builds made by the scripts of this fork of BtbN/FFmpeg-Builds, in the
# public dependency images of upstream (ghcr.io/ffmpeg-builds/ffmpeg-builds/<target>-gpl-<series>), at an exact
# ffmpeg tag. macOS (ARM64, x64): built here on a macOS runner with ffmpeg's own decoders and VideoToolbox only, no
# external libraries, so those builds are LGPL.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: ffmpeg branch or tag to build. The head of a release branch matches upstream's dependency images; the exact commit is recorded.
        required: true
        default: release/9.0
      series:
        description: Upstream image series that matches the tag (addin), for example 9.0
        required: true
        default: '9.0'
      revision:
        description: Our release revision; the release is named after the built version, such as n9.0.2-15-gabc1234-jourfin.<revision>
        required: true
        default: '1'
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [linux64, linuxarm64, win64, winarm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: ./util/free_disk_space.sh
      - name: Build ffmpeg
        run: |
          set -euo pipefail
          # The upstream image holds every dependency, built by these scripts; only ffmpeg itself is built here.
          GITHUB_REPOSITORY=ffmpeg-builds/ffmpeg-builds GIT_BRANCH_OVERRIDE='${{ inputs.tag }}' ./build.sh '${{ matrix.target }}' gpl '${{ inputs.series }}'
          image="ghcr.io/ffmpeg-builds/ffmpeg-builds/${{ matrix.target }}-gpl-${{ inputs.series }}:latest"
          mkdir -p out
          version="$(./ffbuild/ffmpeg/ffbuild/version.sh ffbuild/ffmpeg 2>/dev/null || true)"
          [ -n "$version" ] || version="$(basename artifacts/* | sed -E 's/^ffmpeg-(.*)-${{ matrix.target }}-gpl.*/\1/')"
          echo "$version" > out/VERSION-${{ matrix.target }}
          for f in artifacts/*; do
            case "$f" in
              *.tar.xz) mv "$f" "out/ffmpeg-${{ matrix.target }}-gpl.tar.xz" ;;
              *.zip) mv "$f" "out/ffmpeg-${{ matrix.target }}-gpl.zip" ;;
            esac
          done
          {
            echo "target: ${{ matrix.target }}"
            echo "ffmpeg: ${{ inputs.tag }} at $(git ls-remote https://github.com/FFmpeg/FFmpeg.git 'refs/heads/${{ inputs.tag }}' 'refs/tags/${{ inputs.tag }}^{}' | head -1 | cut -f1) ($version)"
            echo "scripts: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}"
            echo "dependency image: $(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          } > "out/ffmpeg-${{ matrix.target }}.provenance.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: macosarm64
          - arch: x86_64
            target: macos64
    runs-on: macos-latest
    steps:
      - name: Tools
        run: brew install nasm
      - name: Build ffmpeg
        run: |
          set -euo pipefail
          # The whole history (without file contents), as upstream's build does, so the version names agree.
          git clone --filter=blob:none --branch '${{ inputs.tag }}' https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cd ffmpeg
          prefix="$PWD/../prefix"
          # macOS still ships bash 3.2, where an empty array under `set -u` is an error: pass the cross options as a string.
          cross=""
          if [ '${{ matrix.arch }}' != "$(uname -m)" ]; then cross="--enable-cross-compile --arch=${{ matrix.arch }} --target-os=darwin"; fi
          # shellcheck disable=SC2086
          ./configure --prefix="$prefix" $cross --cc="clang -arch ${{ matrix.arch }}" \
            --extra-cflags="-mmacosx-version-min=12.0" --extra-ldflags="-mmacosx-version-min=12.0" \
            --disable-doc --disable-debug --disable-ffplay --disable-autodetect \
            --enable-videotoolbox --enable-audiotoolbox --enable-zlib --enable-bzlib \
            --extra-version=jourfin
          make -j"$(sysctl -n hw.ncpu)"
          make install
          cd ..
          version="$(ffmpeg/ffbuild/version.sh ffmpeg)"
          name="ffmpeg-${{ matrix.target }}-lgpl"
          mkdir -p "pkg/$name/bin" out
          cp prefix/bin/ffmpeg prefix/bin/ffprobe "pkg/$name/bin/"
          cp ffmpeg/COPYING.LGPLv2.1 "pkg/$name/LICENSE.txt"
          (cd pkg && tar -cJf "../out/$name.tar.xz" "$name")
          {
            echo "target: ${{ matrix.target }}"
            echo "ffmpeg: ${{ inputs.tag }} at $(git -C ffmpeg rev-parse HEAD) ($version)"
            echo "configure: $(prefix/bin/ffmpeg -hide_banner -buildconf | tr '\n' ' ')"
            echo "runner: $(sw_vers -productName) $(sw_vers -productVersion), $(clang --version | head -1)"
          } > "out/ffmpeg-${{ matrix.target }}.provenance.txt"
          echo "$version" > out/VERSION-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
  release:
    needs: [build, macos]
    uses: ./.github/workflows/jourfin-publish.yml
    with:
      run_id: ${{ github.run_id }}
      tag: ${{ inputs.tag }}
      revision: ${{ inputs.revision }}
    permissions:
      contents: write
